<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>syslog History — {{ date }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>History — {{ date }}</h1>
    <nav>
      <a href="/">Live Syslog View</a>
      <span class="sep">|</span>
      <a href="/download/today">Download today's syslog</a>
    </nav>
  </header>

  <p id="history-note">
    Static snapshot of today's saved log. Refresh to see newer entries.
  </p>

  <div id="toolbar">
    <input type="text" id="search-input" placeholder="Filter logs…" autocomplete="off">
    <button id="btn-download-filtered" title="Download only the lines matching the current filter">Download filtered</button>
    <span id="counter"></span>
  </div>

  <div id="log-container">
    <div id="log-output"></div>
  </div>

  <script type="application/json" id="log-data">{{ content | tojson }}</script>
  <script src="/static/format.js"></script>
  <script>
    'use strict';
    const logOutput   = document.getElementById('log-output');
    const searchInput = document.getElementById('search-input');
    const counter     = document.getElementById('counter');

    const allLines = JSON.parse(document.getElementById('log-data').textContent)
      .replace(/\n$/, '')
      .split('\n');

    function render() {
      const term = searchInput.value.trim().toLowerCase();
      const visible = term
        ? allLines.filter(line => line.toLowerCase().includes(term))
        : allLines;
      logOutput.innerHTML = visible.length
        ? visible.map(line => `<div class="log-line">${formatLine(line)}</div>`).join('')
        : '<div class="log-line">(no lines match the filter)</div>';
      counter.textContent = `${visible.length} / ${allLines.length} lines`;
    }

    searchInput.addEventListener('input', render);

    document.getElementById('btn-download-filtered').addEventListener('click', () => {
      const term = searchInput.value.trim().toLowerCase();
      const visible = term
        ? allLines.filter(line => line.toLowerCase().includes(term))
        : allLines;
      if (!visible.length) return;
      downloadLines(visible, filteredFilename('{{ date }}', searchInput.value));
    });

    enableTokenFilter(logOutput, searchInput);
    render();
  </script>
</body>
</html>
