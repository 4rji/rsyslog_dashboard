<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rsyslog History — {{ date }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    #history-content {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>History — {{ date }}</h1>
    <nav>
      <a href="/">Live View</a>
      <span class="sep">|</span>
      <a href="/download/today">Download today's log</a>
    </nav>
  </header>

  <p id="history-note">
    Static snapshot of today's saved log. Refresh to see newer entries.
  </p>

  <div id="log-container">
    <pre id="history-content">{{ content }}</pre>
  </div>
</body>
</html>
